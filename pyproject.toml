[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shellshop"
version = "0.1.0"
description = "Terminal-first storefront prototype built with Python and Textual"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "ShellShop contributors" }
]
dependencies = [
  "textual",
  "PyYAML",
]

[project.scripts]
shellshop = "shellshop.__main__:main"

[tool.setuptools.packages.find]
include = ["shellshop*"]
